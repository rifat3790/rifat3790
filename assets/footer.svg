<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="footer-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#96bf48"/>
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .f-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #00f2fe; filter: url(#f-glow); }
      .f-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; fill: #d4af37; }
    </style>
  </defs>

  <rect x="5" y="5" width="940" height="130" rx="14" fill="url(#footer-bg)" stroke="url(#footer-stroke)" stroke-width="1.5"/>

  <g transform="translate(475, 55)" text-anchor="middle">
    <text class="f-title">DESIGNED &amp; BUILT WITH PASSION BY MD. REFAYET HOSSEN</text>
    <text y="30" class="f-sub">✦ Available for Full-Stack Web, SaaS &amp; Shopify Architecture ✦</text>
  </g>
</svg>
