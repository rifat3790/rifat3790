<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07140e"/>
      <stop offset="50%" stop-color="#0f261a"/>
      <stop offset="100%" stop-color="#08140f"/>
    </linearGradient>

    <linearGradient id="sp-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96bf48"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <style>
    .sp-bg-rect { fill: url(#sp-bg); rx: 16px; }
    .sp-border-rect { fill: none; stroke: url(#sp-border); stroke-width: 2px; rx: 16px; }

    .sp-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 26px;
      fill: #4ade80;
      letter-spacing: 2px;
    }

    .sp-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
      letter-spacing: 1px;
    }

    .sp-card-bg {
      fill: #132a1d;
      stroke: #22c55e;
      stroke-width: 1.2px;
      rx: 12px;
    }

    .sp-card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 15px;
      fill: #ffffff;
    }

    .sp-card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #86efac;
    }
  </style>

  <rect class="sp-bg-rect" x="5" y="5" width="940" height="250"/>
  <rect class="sp-border-rect" x="5" y="5" width="940" height="250"/>

  <!-- Header Title -->
  <g transform="translate(475, 45)" text-anchor="middle">
    <text class="sp-header">🛒 SHOPIFY &amp; E-COMMERCE ARCHITECTURE</text>
    <text y="28" class="sp-subtitle">High-Converting Stores • Custom Liquid Themes • Headless Storefronts</text>
  </g>

  <line x1="120" y1="90" x2="830" y2="90" stroke="#166534" stroke-width="1.2"/>

  <!-- 3 Cards -->
  <g transform="translate(35, 110)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect class="sp-card-bg" width="275" height="115"/>
      <text x="20" y="36" class="sp-card-title">🎨 Custom Liquid Themes</text>
      <text x="20" y="64" class="sp-card-desc">✓ Tailored Storefront UI/UX</text>
      <text x="20" y="86" class="sp-card-desc">✓ Pixel-Perfect Mobile Design</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(300, 0)">
      <rect class="sp-card-bg" width="275" height="115"/>
      <text x="20" y="36" class="sp-card-title">⚡ Headless Storefronts</text>
      <text x="20" y="64" class="sp-card-desc">✓ Next.js + Storefront API</text>
      <text x="20" y="86" class="sp-card-desc">✓ Instant Sub-Second Load</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(600, 0)">
      <rect class="sp-card-bg" width="275" height="115"/>
      <text x="20" y="36" class="sp-card-title">🚀 Optimization &amp; CRO</text>
      <text x="20" y="64" class="sp-card-desc">✓ High-Conversion Checkout</text>
      <text x="20" y="86" class="sp-card-desc">✓ Core Web Vitals 95+ Score</text>
    </g>
  </g>
</svg>
