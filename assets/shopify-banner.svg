<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <linearGradient id="shopify-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b130e"/>
      <stop offset="50%" stop-color="#0e1f17"/>
      <stop offset="100%" stop-color="#070c09"/>
    </linearGradient>

    <linearGradient id="shopify-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96bf48"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <linearGradient id="green-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96bf48"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Space+Grotesk:wght@700&amp;display=swap');

      .sp-bg { fill: url(#shopify-bg); rx: 16px; }
      .sp-border { fill: none; stroke: url(#shopify-border); stroke-width: 2px; rx: 16px; }
      .sp-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 28px;
        fill: url(#green-text);
        filter: url(#green-glow);
        letter-spacing: 1.5px;
      }
      .sp-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #94a3b8;
      }
      .sp-card-bg {
        fill: #13231a;
        stroke: #22c55e;
        stroke-width: 1px;
        rx: 10px;
      }
      .sp-card-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #ffffff;
      }
      .sp-card-desc {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #a7f3d0;
      }
      @keyframes pulseShopify {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px #96bf48); }
      }
      .bag-icon { animation: pulseShopify 3s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <rect class="sp-bg" x="5" y="5" width="940" height="250"/>
  <rect class="sp-border" x="5" y="5" width="940" height="250"/>

  <!-- Top Title Area -->
  <g transform="translate(475, 45)" text-anchor="middle">
    <text class="sp-title">🛒 SHOPIFY &amp; E-COMMERCE ARCHITECTURE</text>
    <text y="28" class="sp-sub">High-Converting Stores • Custom Liquid Themes • Headless Storefronts</text>
  </g>

  <!-- 3 Capability Cards Grid -->
  <g transform="translate(35, 105)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect class="sp-card-bg" width="275" height="115"/>
      <text x="20" y="35" class="sp-card-title">🎨 Custom Liquid Themes</text>
      <text x="20" y="62" class="sp-card-desc">• Tailored Storefront UI/UX</text>
      <text x="20" y="82" class="sp-card-desc">• Pixel-Perfect Mobile Design</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(300, 0)">
      <rect class="sp-card-bg" width="275" height="115"/>
      <text x="20" y="35" class="sp-card-title">⚡ Headless Storefronts</text>
      <text x="20" y="62" class="sp-card-desc">• Next.js + Storefront API</text>
      <text x="20" y="82" class="sp-card-desc">• Instant Sub-Second Load</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(600, 0)">
      <rect class="sp-card-bg" width="275" height="115"/>
      <text x="20" y="35" class="sp-card-title">🚀 Optimization &amp; CRO</text>
      <text x="20" y="62" class="sp-card-desc">• High-Conversion Checkout</text>
      <text x="20" y="82" class="sp-card-desc">• Core Web Vitals 95+ Score</text>
    </g>
  </g>
</svg>
