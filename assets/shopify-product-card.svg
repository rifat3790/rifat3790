<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <linearGradient id="prod-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>

    <linearGradient id="prod-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#96bf48"/>
    </linearGradient>

    <linearGradient id="gold-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <style>
    .p-bg { fill: url(#prod-bg); rx: 16px; }
    .p-border { fill: none; stroke: url(#prod-border); stroke-width: 2px; rx: 16px; }

    .p-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #fbbf24; }
    .p-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #94a3b8; }

    .card-box { fill: #0f172a; stroke: #334155; stroke-width: 1px; rx: 12px; }
    .p-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 15px; fill: #ffffff; }
    .p-price { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #38bdf8; }
    .p-badge { fill: #96bf48; rx: 4px; }
    .p-badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #05070f; }

    .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #0f172a; }
  </style>

  <rect class="p-bg" x="5" y="5" width="940" height="310"/>
  <rect class="p-border" x="5" y="5" width="940" height="310"/>

  <g transform="translate(475, 42)" text-anchor="middle">
    <text class="p-head">💎 LUXURY SHOPIFY STOREFRONT UI DEMO</text>
    <text y="24" class="p-sub">Custom Headless Component • Sub-second Instant Add-to-Cart</text>
  </g>

  <!-- 3 Product Preview Cards -->
  <g transform="translate(45, 95)">

    <!-- Product 1 -->
    <g transform="translate(0,0)">
      <rect class="card-box" width="265" height="190"/>
      <!-- Image Mockup Container -->
      <rect x="15" y="15" width="235" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="132" y="65" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8" text-anchor="middle">🛍️</text>

      <text x="15" y="126" class="p-name">Aura Edition Chrono</text>
      <text x="15" y="146" class="p-price">$1,499.00 USD</text>

      <!-- Add to Cart Btn -->
      <rect x="140" y="130" width="110" height="36" rx="18" fill="url(#gold-btn)"/>
      <text x="195" y="153" class="btn-text" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(295,0)">
      <rect class="card-box" width="265" height="190"/>
      <rect x="15" y="15" width="235" height="90" rx="8" fill="#1e293b" stroke="#96bf48" stroke-width="1"/>
      <text x="132" y="65" font-family="sans-serif" font-weight="bold" font-size="28" fill="#96bf48" text-anchor="middle">✨</text>

      <text x="15" y="126" class="p-name">Vanguard Headset Pro</text>
      <text x="15" y="146" class="p-price">$899.00 USD</text>

      <rect x="140" y="130" width="110" height="36" rx="18" fill="url(#gold-btn)"/>
      <text x="195" y="153" class="btn-text" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 3 -->
    <g transform="translate(590,0)">
      <rect class="card-box" width="265" height="190"/>
      <rect x="15" y="15" width="235" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
      <text x="132" y="65" font-family="sans-serif" font-weight="bold" font-size="28" fill="#fbbf24" text-anchor="middle">💎</text>

      <text x="15" y="126" class="p-name">Luxe Leather Suite</text>
      <text x="15" y="146" class="p-price">$2,250.00 USD</text>

      <rect x="140" y="130" width="110" height="36" rx="18" fill="url(#gold-btn)"/>
      <text x="195" y="153" class="btn-text" text-anchor="middle">Add to Cart</text>
    </g>

  </g>
</svg>
