<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="33%" stop-color="#4facfe"/>
      <stop offset="66%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>

    <linearGradient id="shopify-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96bf48"/>
      <stop offset="100%" stop-color="#4776e6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Embedded CSS Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

      .bg-rect { fill: url(#bg-grad); rx: 20px; }
      .border-rect { fill: none; stroke: url(#border-grad); stroke-width: 2.5px; rx: 20px; }

      .title-text {
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#text-grad);
        filter: url(#neon-glow);
        letter-spacing: 2px;
      }

      .subtitle-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      .tag-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #ffffff;
      }

      /* Animations */
      @keyframes laserSweep {
        0% { transform: translateX(-1000px); }
        100% { transform: translateX(1000px); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      @keyframes floatEffect {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      @keyframes badgeShine {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      }

      .laser-line {
        animation: laserSweep 6s infinite linear;
      }

      .floating-icon {
        animation: floatEffect 4s ease-in-out infinite;
      }

      .glowing-orb {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .badge-box {
        animation: badgeShine 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect class="bg-rect" x="5" y="5" width="940" height="310"/>

  <!-- Glowing Orbs in Background -->
  <circle class="glowing-orb" cx="150" cy="80" r="100" fill="#00f2fe" opacity="0.15" filter="url(#neon-glow)"/>
  <circle class="glowing-orb" cx="800" cy="240" r="120" fill="#7000ff" opacity="0.12" filter="url(#neon-glow)"/>
  <circle class="glowing-orb" cx="500" cy="160" r="90" fill="#d4af37" opacity="0.08" filter="url(#neon-glow)"/>

  <!-- Border Frame -->
  <rect class="border-rect" x="5" y="5" width="940" height="310"/>

  <!-- Header Content -->
  <g transform="translate(475, 75)" text-anchor="middle">
    <!-- Top Crown Icon -->
    <g class="floating-icon" transform="translate(0, -25)">
      <path d="M-20,5 L-12,-15 L0,-5 L12,-15 L20,5 Z" fill="url(#gold-grad)" filter="url(#subtle-glow)"/>
      <circle cx="-12" cy="-17" r="2.5" fill="#ffffff"/>
      <circle cx="0" cy="-7" r="2.5" fill="#ffffff"/>
      <circle cx="12" cy="-17" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Main Title -->
    <text y="35" class="title-text">MD. REFAYET HOSSEN</text>

    <!-- Subtitle -->
    <text y="70" class="subtitle-text">FULL STACK DEVELOPER • SHOPIFY ARCHITECT • SAAS BUILDER</text>
  </g>

  <!-- Divider Line -->
  <line x1="150" y1="175" x2="800" y2="175" stroke="url(#border-grad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Floating Feature Badges -->
  <g transform="translate(70, 210)">
    <!-- Badge 1: Next.js -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.9"/>
      <circle cx="25" cy="21" r="7" fill="#00f2fe" filter="url(#subtle-glow)"/>
      <text x="42" y="26" class="tag-text">Next.js 15 &amp; React</text>
    </g>

    <!-- Badge 2: Shopify -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#0f172a" stroke="#96bf48" stroke-width="1.2" opacity="0.9"/>
      <circle cx="25" cy="21" r="7" fill="#96bf48" filter="url(#subtle-glow)"/>
      <text x="42" y="26" class="tag-text">Shopify Liquid &amp; Store</text>
    </g>

    <!-- Badge 3: TypeScript -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#0f172a" stroke="#3178c6" stroke-width="1.2" opacity="0.9"/>
      <circle cx="25" cy="21" r="7" fill="#3178c6" filter="url(#subtle-glow)"/>
      <text x="42" y="26" class="tag-text">TypeScript &amp; Node</text>
    </g>

    <!-- Badge 4: Luxury Web -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#0f172a" stroke="#d4af37" stroke-width="1.2" opacity="0.9"/>
      <circle cx="25" cy="21" r="7" fill="#d4af37" filter="url(#subtle-glow)"/>
      <text x="42" y="26" class="tag-text">Luxury UI/UX &amp; SaaS</text>
    </g>
  </g>

  <!-- Laser Light Sweep Effect -->
  <g class="laser-line">
    <line x1="0" y1="175" x2="150" y2="175" stroke="#00f2fe" stroke-width="3" filter="url(#neon-glow)"/>
  </g>
</svg>
