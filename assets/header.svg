<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <!-- Metallic Border Gradient -->
    <linearGradient id="h-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="sub-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#h-bg); rx: 16px; }
    .border { fill: none; stroke: url(#h-border); stroke-width: 2px; rx: 16px; }

    .title-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 38px;
      fill: url(#name-gradient);
      letter-spacing: 3px;
    }

    .title-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: url(#sub-gradient);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .chip-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.2px;
      rx: 8px;
    }

    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #f8fafc;
    }
  </style>

  <!-- Background Base -->
  <rect class="bg" x="5" y="5" width="940" height="270"/>
  <rect class="border" x="5" y="5" width="940" height="270"/>

  <!-- Top Accent Bar -->
  <path d="M 5,20 Q 5,5 20,5 L 930,5 Q 945,5 945,20 L 945,10 L 5,10 Z" fill="url(#h-border)"/>

  <!-- Center Content -->
  <g transform="translate(475, 68)" text-anchor="middle">

    <!-- Crown Icon -->
    <g transform="translate(0, -20)">
      <path d="M-14,4 L-9,-10 L0,-3 L9,-10 L14,4 Z" fill="#fbbf24" stroke="#d4af37" stroke-width="1"/>
      <circle cx="-9" cy="-12" r="1.8" fill="#ffffff"/>
      <circle cx="0" cy="-5" r="1.8" fill="#ffffff"/>
      <circle cx="9" cy="-12" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Name Text -->
    <text y="30" class="title-name">MD. REFAYET HOSSEN</text>

    <!-- Line Divider -->
    <line x1="-200" y1="46" x2="200" y2="46" stroke="url(#h-border)" stroke-width="1.8"/>

    <!-- Subtitle -->
    <text y="70" class="title-sub">FULL STACK DEVELOPER • SHOPIFY ARCHITECT • SAAS BUILDER</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="170" x2="870" y2="170" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Tech Badge Chips -->
  <g transform="translate(45, 192)">

    <!-- Chip 1: Next.js 15 -->
    <g transform="translate(0, 0)">
      <rect class="chip-bg" width="195" height="44" stroke="#38bdf8"/>
      <svg x="14" y="10" width="24" height="24" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="64" fill="#ffffff"/>
        <path d="M108 102L50 28H38v72h14V49l45 59h11z" fill="#000000"/>
        <path d="M86 42h14v30H86z" fill="#000000"/>
      </svg>
      <text x="48" y="27" class="chip-text">Next.js 15 &amp; React</text>
    </g>

    <!-- Chip 2: Shopify Store -->
    <g transform="translate(215, 0)">
      <rect class="chip-bg" width="220" height="44" stroke="#96bf48"/>
      <svg x="14" y="9" width="24" height="24" viewBox="0 0 50 50">
        <path d="M39.6 13.5s-2.7-.8-4.4-.3c-1.3.4-1.7 1.2-2.1 2.3-.6 1.7-1.3 4.2-1.9 6.2-.5-1.7-1.6-4.5-3.1-6.1-2.1-2.2-5.4-3.1-8.5-2.2-3.8 1.1-6.3 4.4-6.8 8.3-.4 3.1.5 6.3 2.5 8.7 1.8 2.1 4.5 3.3 7.3 3.3 2 0 4.1-.7 5.7-1.9l.6.9c.4.6 1.1 1 1.8 1h9.4c1.2 0 2.2-1 2.2-2.2V16.3c-.1-1.5-1.2-2.6-2.7-2.8z" fill="#96bf48"/>
      </svg>
      <text x="48" y="27" class="chip-text">Shopify Liquid &amp; Store</text>
    </g>

    <!-- Chip 3: TypeScript & Node -->
    <g transform="translate(455, 0)">
      <rect class="chip-bg" width="195" height="44" stroke="#3178c6"/>
      <svg x="14" y="10" width="24" height="24" viewBox="0 0 100 100">
        <rect width="100" height="100" rx="15" fill="#3178c6"/>
        <path d="M58 64c2 3 6 5 11 5 6 0 9-3 9-7 0-11-20-4-20-21 0-8 7-14 18-14 7 0 13 2 17 7l-6 8c-3-3-7-5-11-5-5 0-7 2-7 5 0 10 20 4 20 21 0 9-7 14-19 14-8 0-16-3-20-9l8-8zM24 37h28v11H39v39H24V48H10V37h14z" fill="#ffffff"/>
      </svg>
      <text x="48" y="27" class="chip-text">TypeScript &amp; Node</text>
    </g>

    <!-- Chip 4: Luxury Web & SaaS -->
    <g transform="translate(670, 0)">
      <rect class="chip-bg" width="190" height="44" stroke="#fbbf24"/>
      <svg x="14" y="10" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2">
        <polygon points="6 3 18 3 22 9 12 21 2 9 6 3"/>
      </svg>
      <text x="48" y="27" class="chip-text">Luxury UI &amp; SaaS</text>
    </g>

  </g>
</svg>
