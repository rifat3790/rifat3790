<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 310" width="100%" height="100%">
  <defs>
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="ts-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <style>
    .ts-bg-rect { fill: url(#ts-bg); rx: 16px; }
    .ts-border-rect { fill: none; stroke: url(#ts-border); stroke-width: 2px; rx: 16px; }

    .ts-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }

    .cat-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 13px;
      fill: #fbbf24;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .tech-box {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.2px;
      rx: 8px;
    }

    .tech-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #f8fafc;
    }
  </style>

  <rect class="ts-bg-rect" x="5" y="5" width="940" height="300"/>
  <rect class="ts-border-rect" x="5" y="5" width="940" height="300"/>

  <!-- Title Header -->
  <text x="475" y="42" class="ts-title" text-anchor="middle">⚡ FULL STACK TECH ECOSYSTEM</text>
  <line x1="120" y1="56" x2="830" y2="56" stroke="#334155" stroke-width="1.2"/>

  <!-- Row 1: Frontend -->
  <g transform="translate(35, 75)">
    <text x="0" y="16" class="cat-label">🚀 FRONTEND &amp; UI ARCHITECTURE</text>
    <g transform="translate(0, 28)">
      <!-- Next.js -->
      <g transform="translate(0,0)">
        <rect class="tech-box" width="115" height="40" stroke="#38bdf8"/>
        <text x="57" y="25" class="tech-text" text-anchor="middle">Next.js 15</text>
      </g>
      <!-- React -->
      <g transform="translate(125,0)">
        <rect class="tech-box" width="105" height="40" stroke="#61dafb"/>
        <text x="52" y="25" class="tech-text" text-anchor="middle">React.js</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(240,0)">
        <rect class="tech-box" width="115" height="40" stroke="#3178c6"/>
        <text x="57" y="25" class="tech-text" text-anchor="middle">TypeScript</text>
      </g>
      <!-- Tailwind CSS -->
      <g transform="translate(365,0)">
        <rect class="tech-box" width="125" height="40" stroke="#38bdf8"/>
        <text x="62" y="25" class="tech-text" text-anchor="middle">Tailwind CSS</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(500,0)">
        <rect class="tech-box" width="115" height="40" stroke="#f7df1e"/>
        <text x="57" y="25" class="tech-text" text-anchor="middle">JavaScript</text>
      </g>
      <!-- Redux Toolkit -->
      <g transform="translate(625,0)">
        <rect class="tech-box" width="125" height="40" stroke="#764abc"/>
        <text x="62" y="25" class="tech-text" text-anchor="middle">Redux Toolkit</text>
      </g>
      <!-- HTML5 / CSS3 -->
      <g transform="translate(760,0)">
        <rect class="tech-box" width="115" height="40" stroke="#e34f26"/>
        <text x="57" y="25" class="tech-text" text-anchor="middle">HTML5 / CSS3</text>
      </g>
    </g>
  </g>

  <!-- Row 2: Backend, Database & Shopify -->
  <g transform="translate(35, 180)">
    <text x="0" y="16" class="cat-label">⚙️ BACKEND, SHOPIFY &amp; CLOUD DATABASE</text>
    <g transform="translate(0, 28)">
      <!-- Node.js -->
      <g transform="translate(0,0)">
        <rect class="tech-box" width="105" height="40" stroke="#22c55e"/>
        <text x="52" y="25" class="tech-text" text-anchor="middle">Node.js</text>
      </g>
      <!-- Express.js -->
      <g transform="translate(115,0)">
        <rect class="tech-box" width="115" height="40" stroke="#cbd5e1"/>
        <text x="57" y="25" class="tech-text" text-anchor="middle">Express.js</text>
      </g>
      <!-- MongoDB -->
      <g transform="translate(240,0)">
        <rect class="tech-box" width="115" height="40" stroke="#47a248"/>
        <text x="57" y="25" class="tech-text" text-anchor="middle">MongoDB</text>
      </g>
      <!-- MySQL -->
      <g transform="translate(365,0)">
        <rect class="tech-box" width="95" height="40" stroke="#00758f"/>
        <text x="47" y="25" class="tech-text" text-anchor="middle">MySQL</text>
      </g>
      <!-- Shopify Liquid -->
      <g transform="translate(470,0)">
        <rect class="tech-box" width="155" height="40" stroke="#96bf48"/>
        <text x="77" y="25" class="tech-text" text-anchor="middle">Shopify Liquid</text>
      </g>
      <!-- Firebase -->
      <g transform="translate(635,0)">
        <rect class="tech-box" width="105" height="40" stroke="#ffca28"/>
        <text x="52" y="25" class="tech-text" text-anchor="middle">Firebase</text>
      </g>
      <!-- REST & GraphQL -->
      <g transform="translate(750,0)">
        <rect class="tech-box" width="125" height="40" stroke="#e10098"/>
        <text x="62" y="25" class="tech-text" text-anchor="middle">REST &amp; GraphQL</text>
      </g>
    </g>
  </g>
</svg>
